name: ci

on:
  push:
  pull_request:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Playwright (usa o Chrome do runner em /usr/bin/google-chrome)
        run: python -m pip install playwright
      - name: Montar e testar (motor em Node, navegador em Playwright)
        run: sh testar.sh
