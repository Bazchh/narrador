name: ci

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Instalar
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formato
        run: ruff format --check .
      - name: Tipos
        run: mypy
      - name: Testes
        run: pytest
      - name: Versão
        run: narrador --versao
